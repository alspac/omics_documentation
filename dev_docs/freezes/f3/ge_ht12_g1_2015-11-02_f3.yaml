  - id: alspacdcs:ge_ht12_g1_2015-11-02_molgenis_f3
    name: Molgenis
    description: >-
      Dataset part for the Molgenis data in ge_ht12_g1 version 2015-11-02 freeze3
    data_distributions:
      - id: alspacdcs:d7a6826fe6b4d3a0c853ec7eaa8e55e6_molgenis.csv
        name: molgenis.csv
